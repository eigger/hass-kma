# Shared standards; upstream action SHAs verified 2026-10-18.
name: Tests
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@ca740d88b32fa5dcbc94c41fce2908450c76ed50
    with:
      standards-ref: ca740d88b32fa5dcbc94c41fce2908450c76ed50
      domain: kma
      python-versions: '["3.14"]'
      lint-python-version: '3.14'
      requirements: requirements_test.txt
      expected-ha-version: '2026.10.2'
      test-profile: ha
      ha-components: 'weather sensor binary_sensor button image'
      dependency-modes: '["current"]'
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@ca740d88b32fa5dcbc94c41fce2908450c76ed50
    with:
      standards-ref: ca740d88b32fa5dcbc94c41fce2908450c76ed50
      domain: kma
      python-versions: '["3.14"]'
      lint-python-version: '3.14'
      requirements: requirements_test_min.txt
      expected-ha-version: '2026.9.0'
      test-profile: ha
      ha-components: 'weather sensor binary_sensor button image'
      dependency-modes: '["current"]'