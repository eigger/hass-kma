# Shared standards; upstream action SHAs verified 2026-10-18.
name: Tests
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@1524e4d71b0976812bb854f9e390b94408a96b52
    with:
      domain: kma
      python-versions: '["3.14"]'
      lint-python-version: '3.14'
      requirements: requirements_test.txt
      expected-ha-version: '2026.10.2'
      test-profile: ha
      ha-components: 'weather sensor binary_sensor button image'
      dependency-modes: '["current"]'
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@1524e4d71b0976812bb854f9e390b94408a96b52
    with:
      domain: kma
      python-versions: '["3.14"]'
      lint-python-version: '3.14'
      requirements: requirements_test_min.txt
      expected-ha-version: '2026.9.0'
      test-profile: ha
      ha-components: 'weather sensor binary_sensor button image'
      dependency-modes: '["current"]'