# Shared standards; upstream action SHAs verified 2026-10-18.
name: Validate
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: eigger/hass-repo-standards/.github/workflows/validate-integration.yml@1524e4d71b0976812bb854f9e390b94408a96b52